[tool.poetry]
name = "openai-realtime-voice-agent"
version = "0.1.0"
description = "Home Assistant addon for OpenAI Realtime API voice control with WebSocket support using Pipecat"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Pinned to the 0.0.x line: this codebase targets the Pipecat 0.0.x API
# (FrameSerializerType, OpenAIRealtimeLLMService, SessionProperties events,
# WebsocketServerParams). Without a lockfile pip otherwise resolves Pipecat
# 1.x, whose changed API breaks the imports. 0.0.97 is the version this was
# developed/tested against.
# Extra "google" (2026-08-30) přidává google-genai a s ním
# pipecat.services.google.gemini_live.GeminiLiveLLMService — druhou „pusu"
# Žána, kterou zapíná env ZAN_PUSA=gemini (viz app/gemini_safety.py). Samotná
# služba je v pipecatu 0.0.97 už obsažená; bez tohohle extra jen chybí
# google-genai a import by spadl. Na openai pusu to nemá vliv — modul se
# importuje až uvnitř gemini větve.
pipecat-ai = {extras = ["mcp", "openai", "websocket", "google"], version = "0.0.97"}
python-dotenv = ">=1.0.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
websockets = ">=13.0"

[tool.poetry.scripts]
start = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
